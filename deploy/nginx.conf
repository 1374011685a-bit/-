# Block Jump - static hosting. Drop-in replacement for the default site that
# ships with nginx:alpine, so the container works on Sealos (or any k8s)
# without further configuration.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    # The game is one page; anything else falls back to it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_vary         on;

    # The page is tiny and changes whenever you redeploy, so never cache it...
    location = /index.html {
        expires -1;
    }

    # ...while the code and icons can be reused for a few minutes. (Filenames
    # are not content-hashed, so a long cache would serve stale files after a
    # redeploy; bump this only if you add hashing.)
    location ~* \.(?:js|css|json|png|svg|ico|jpg|woff2?)$ {
        expires 10m;
    }

    # Set once at server level: a nested add_header would reset inheritance.
    add_header X-Content-Type-Options nosniff always;
}
