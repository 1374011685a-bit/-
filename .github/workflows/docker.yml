# 在 GitHub 的 runner 上构建镜像并推到 GHCR，本机不需要装 Docker。
# 推送到 main、打 v* 标签，或在 Actions 页面手动 Run workflow 都会触发。
#
# 跑成功后镜像地址：ghcr.io/1374011685a-bit/block-jump:latest
#   首次跑完要去 Packages 里把这个包设为 Public，Sealos 才能免密钥拉取。

name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  # 固定写死成小写且合法的名字。不要用 ghcr.io/${{ github.repository }}：
  # 本仓库名是 "-"，纯符号不是合法的镜像名，会被 GHCR 拒绝。
  IMAGE: ghcr.io/1374011685a-bit/block-jump

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 自动定位 Dockerfile：文件放在仓库根目录、还是被套在子文件夹里都能用。
      - id: ctx
        name: locate Dockerfile
        run: |
          dir=$(find . -name Dockerfile -not -path './.git/*' -printf '%h\n' | sort | head -n1)
          if [ -z "$dir" ]; then
            echo "::error::找不到 Dockerfile，请确认它已经上传到仓库里"
            exit 1
          fi
          echo "context=$dir" >> "$GITHUB_OUTPUT"
          echo "构建上下文: $dir"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
